# Development: docker compose up -d, then http://jumphp.localhost:8000 (portal) and http://play.jumphp.localhost:8000
# (games). The code is mounted; production: deploy/compose.yaml.
services:
  app:
    build: { context: ., target: base }
    image: jumphp-playground:dev
    ports: ["127.0.0.1:8000:80"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/app"]
    environment:
      SERVER_NAMES: ":80, :8000"    # :8000 too: the shooter (same network) opens the games at their real address
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/caddy
      XDG_DATA_HOME: /tmp/caddy
    env_file: [{ path: .env.local, required: false }]
    depends_on: [db]
  worker:
    image: jumphp-playground:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/app"]
    environment:
      HOME: /tmp
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    env_file: [{ path: .env.local, required: false }]
    restart: unless-stopped
    depends_on: [db, app]
  # the screenshots of games without a picture: their own worker (one game at a time) and headless Chrome,
  # in the app's network so that http://play.jumphp.localhost:8000 reaches it
  worker-shots:
    image: jumphp-playground:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/app"]
    environment:
      HOME: /tmp
    command: ["php", "bin/console", "messenger:consume", "shots", "--time-limit=3600", "-vv"]
    env_file: [{ path: .env.local, required: false }]
    restart: unless-stopped
    depends_on: [db, app]
  shooter:
    image: ghcr.io/puppeteer/puppeteer:24.10.0
    network_mode: "service:app"
    init: true
    volumes: ["./shooter:/shooter:ro"]
    environment:
      NODE_PATH: /home/pptruser/node_modules
      SHOOTER_ALLOW: http://play.jumphp.localhost:8000/
    command: ["node", "/shooter/server.cjs"]
    restart: unless-stopped
    depends_on: [app]
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: playground
      MARIADB_USER: playground
      MARIADB_PASSWORD: playground
      MARIADB_ROOT_PASSWORD: root
    volumes: [db:/var/lib/mysql]

volumes:
  db:

