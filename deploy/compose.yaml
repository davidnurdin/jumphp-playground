# Production, behind the Traefik already running on the server, which only forwards the traffic: TLS passes
# through (TCP routers), FrankenPHP gets its own certificates for both hosts (HTTP challenge through Traefik's
# port 80 entry point). Settings and secrets: deploy/.env (see .env.example). From the repository's root:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
name: jumphp-playground
x-app: &app
  build: { context: .., target: prod }
  image: jumphp-playground:prod
  restart: unless-stopped
  environment: &env
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET}
    APP_URL: https://${APP_HOST}
    APP_HOST: ${APP_HOST}
    PLAY_URL: https://${PLAY_HOST}
    PLAY_HOST: ${PLAY_HOST}
    DATABASE_URL: mysql://playground:${DB_PASSWORD}@db:3306/playground?serverVersion=11.4.0-MariaDB&charset=utf8mb4
    TOKEN_KEY: ${TOKEN_KEY}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    JUMPHP_RUNTIMES: ${JUMPHP_RUNTIMES}
    SHOOTER_URL: http://shooter:3000
  volumes:
    - storage:/app/var/storage
    - engines:/app/public/engine
  depends_on: [db]

services:
  app:
    <<: *app
    environment:
      <<: *env
      SERVER_NAMES: ${APP_HOST}, ${PLAY_HOST}
      # www and the previous names, redirected to the real ones (docker/Caddyfile)
      APP_ALIASES: www.${APP_HOST}, ${OLD_APP_HOST:-http://old-app.localhost}
      PLAY_ALIASES: ${OLD_PLAY_HOST:-http://old-play.localhost}
    volumes:
      - storage:/app/var/storage
      - engines:/app/public/engine
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, traefik]
    # Traefik routes the container only once healthy: check often so a redeploy is back in seconds
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2019/metrics >/dev/null || exit 1"]
      interval: 30s
      start_interval: 2s
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.jumphp-playground-http.rule=Host(`${APP_HOST}`) || Host(`${PLAY_HOST}`) || Host(`www.${APP_HOST}`) || Host(`${OLD_APP_HOST:-old-app.localhost}`) || Host(`${OLD_PLAY_HOST:-old-play.localhost}`)
      - traefik.http.routers.jumphp-playground-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT}
      - traefik.http.routers.jumphp-playground-http.service=jumphp-playground-http
      - traefik.http.services.jumphp-playground-http.loadbalancer.server.port=80
      - traefik.tcp.routers.jumphp-playground-tls.rule=HostSNI(`${APP_HOST}`) || HostSNI(`${PLAY_HOST}`) || HostSNI(`www.${APP_HOST}`) || HostSNI(`${OLD_APP_HOST:-old-app.localhost}`) || HostSNI(`${OLD_PLAY_HOST:-old-play.localhost}`)
      - traefik.tcp.routers.jumphp-playground-tls.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.tcp.routers.jumphp-playground-tls.service=jumphp-playground-tls
      - traefik.tcp.routers.jumphp-playground-tls.tls.passthrough=true
      - traefik.tcp.services.jumphp-playground-tls.loadbalancer.server.port=443

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    healthcheck: { disable: true }
    depends_on: [db, app]

  # the screenshots of games without a picture: one game at a time, in headless Chrome (shooter/server.cjs)
  worker-shots:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "shots", "--time-limit=3600", "--memory-limit=256M"]
    healthcheck: { disable: true }
    depends_on: [db, app, shooter]

  shooter:
    image: ghcr.io/puppeteer/puppeteer:24.10.0
    restart: unless-stopped
    init: true
    volumes: ["../shooter:/shooter:ro"]
    environment:
      NODE_PATH: /home/pptruser/node_modules
      SHOOTER_ALLOW: https://${PLAY_HOST}/
      # straight to the app (its own certificate), not through Traefik
      SHOOTER_MAP: MAP ${PLAY_HOST} app
    command: ["node", "/shooter/server.cjs"]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: playground
      MARIADB_USER: playground
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [db:/var/lib/mysql]

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true

volumes:
  db:
  storage:
  engines:
  caddy_data:
  caddy_config:
